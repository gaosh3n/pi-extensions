default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt
        entry: pnpm exec oxfmt --write
        language: system
        files: \.(?:[cm]?[jt]sx?|json)$
      - id: check-commit-message
        name: check commit message
        entry: scripts/check-commit-message.sh
        language: script
        stages:
          - commit-msg
